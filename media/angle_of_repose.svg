<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img" aria-label="Angle of Repose Measurement Schematic (Ph. Eur. 2.9.36)">
  <rect width="760" height="320" rx="12" fill="#f9fbfa" stroke="#d9e2df" stroke-width="1.5"/>
  <text x="28" y="34" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1e292b">Angle of Repose — Fixed-Base Cone Method (Ph. Eur. 2.9.36)</text>
  <text x="28" y="54" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#526066">Subtract pedestal height h_base from total height h_total before calculating α = arctan(2 · h_cone / d)</text>

  <!-- Funnel above cone -->
  <polygon points="215,66 285,66 260,104 240,104" fill="#ffffff" stroke="#526066" stroke-width="2"/>
  <rect x="244" y="104" width="12" height="14" fill="#ffffff" stroke="#526066" stroke-width="2"/>
  <!-- Falling powder stream -->
  <line x1="250" y1="118" x2="250" y2="140" stroke="#2c6e5d" stroke-width="2" stroke-dasharray="3,3"/>

  <!-- Powder Cone -->
  <polygon points="120,230 250,142 380,230" fill="#97baaf" opacity="0.65" stroke="#2c6e5d" stroke-width="2.2"/>

  <!-- Pedestal / Base -->
  <rect x="120" y="230" width="260" height="34" rx="2" fill="#dce5e2" stroke="#4b3f63" stroke-width="2"/>
  <text x="250" y="251" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#4b3f63">Circular Pedestal Base (diameter d)</text>
  <!-- Bench line -->
  <line x1="60" y1="264" x2="430" y2="264" stroke="#1e292b" stroke-width="2"/>

  <!-- Centerline & Cone Height h_cone -->
  <line x1="250" y1="142" x2="250" y2="230" stroke="#1e292b" stroke-width="1.6" stroke-dasharray="5,4"/>
  <text x="258" y="192" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1e292b">h_cone</text>

  <!-- Total Height h_total dimension -->
  <line x1="88" y1="142" x2="88" y2="264" stroke="#2c6e5d" stroke-width="1.8"/>
  <line x1="82" y1="142" x2="244" y2="142" stroke="#2c6e5d" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="82" y1="264" x2="94" y2="264" stroke="#2c6e5d" stroke-width="1.8"/>
  <text x="74" y="205" text-anchor="middle" transform="rotate(-90 74 205)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#2c6e5d">h_total</text>

  <!-- Base Height h_base dimension -->
  <line x1="402" y1="230" x2="402" y2="264" stroke="#4b3f63" stroke-width="2"/>
  <line x1="396" y1="230" x2="408" y2="230" stroke="#4b3f63" stroke-width="1.8"/>
  <line x1="396" y1="264" x2="408" y2="264" stroke="#4b3f63" stroke-width="1.8"/>
  <text x="412" y="251" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#4b3f63">h_base</text>

  <!-- Diameter d dimension -->
  <line x1="120" y1="282" x2="380" y2="282" stroke="#1e292b" stroke-width="1.6"/>
  <line x1="120" y1="276" x2="120" y2="288" stroke="#1e292b" stroke-width="1.6"/>
  <line x1="380" y1="276" x2="380" y2="288" stroke="#1e292b" stroke-width="1.6"/>
  <text x="250" y="297" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1e292b">Base Diameter d = 2r</text>

  <!-- Angle arc alpha -->
  <path d="M162 230 A42 42 0 0 0 155 206" fill="none" stroke="#b91c1c" stroke-width="2.2"/>
  <text x="168" y="222" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#b91c1c">α</text>

  <!-- Formula Summary Box -->
  <rect x="472" y="92" width="260" height="184" rx="8" fill="#ffffff" stroke="#d9e2df" stroke-width="1.5"/>
  <text x="490" y="118" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1e292b">Geometry &amp; Equations</text>
  <text x="490" y="148" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1e292b" font-weight="600">Effective Cone Height:</text>
  <text x="490" y="166" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#526066">h_cone = h_total − h_base</text>
  <text x="490" y="196" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1e292b" font-weight="600">Angle of Repose (α):</text>
  <text x="490" y="214" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#2c6e5d" font-weight="600">tan(α) = h_cone / r = 2 · h_cone / d</text>
  <text x="490" y="234" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#526066">α = arctan(2 · h_cone / d) [°]</text>
  <text x="490" y="260" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#526066">Note: Keep h_total, h_base, and d in the same unit (cm or mm).</text>
</svg>
